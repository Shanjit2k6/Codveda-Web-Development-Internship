<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – TaskVault</title>
  <meta name="description" content="Manage your tasks in the TaskVault dashboard." />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Delete confirmation modal -->
  <div class="modal-overlay confirm-dialog" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="confirmTitle">Delete Task</h3>
        <button class="modal-close" id="confirmCancel" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="confirm-icon">🗑️</div>
        <p style="text-align:center;color:var(--text-secondary);">Are you sure you want to delete this task? This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Delete Task</button>
      </div>
    </div>
  </div>

  <!-- Edit task modal -->
  <div class="modal-overlay" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="editModalTitle">Edit Task</h3>
        <button class="modal-close" id="editModalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <form id="editForm" class="auth-form" style="gap:16px;" novalidate>
          <input type="hidden" id="editTaskId" />
          <div class="form-group">
            <label class="form-label" for="editTitle">Title <span style="color:var(--danger)">*</span></label>
            <input type="text" id="editTitle" class="form-input" placeholder="Task title" required />
            <span class="form-error" id="editTitleError"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="editDesc">Description</label>
            <textarea id="editDesc" class="form-textarea" placeholder="Optional description…"></textarea>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group">
              <label class="form-label" for="editPriority">Priority</label>
              <select id="editPriority" class="form-select">
                <option value="low">🟢 Low</option>
                <option value="medium" selected>🟡 Medium</option>
                <option value="high">🔴 High</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="editDue">Due date</label>
              <input type="date" id="editDue" class="form-input" />
            </div>
          </div>
          <div class="form-group" style="flex-direction:row;align-items:center;gap:10px;">
            <input type="checkbox" id="editCompleted" style="width:18px;height:18px;accent-color:var(--primary);cursor:pointer;" />
            <label for="editCompleted" class="form-label" style="margin:0;cursor:pointer;font-weight:500;">Mark as completed</label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="editCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="editSaveBtn">
          <span id="editBtnText">Save Changes</span>
          <span id="editSpinner" class="spinner" style="display:none;border-color:rgba(255,255,255,.3);border-top-color:#fff;"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- App shell -->
  <div class="app-shell">
    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🗄️</div>
        <span class="sidebar-brand">TaskVault</span>
      </div>

      <div class="sidebar-user">
        <div class="sidebar-user-card">
          <div class="user-avatar" id="userAvatarLetter">?</div>
          <div>
            <div class="user-name" id="sidebarUserName">Loading…</div>
            <div class="user-email" id="sidebarUserEmail"></div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-item active">
          <span>📋</span> My Tasks
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-full" id="logoutBtn" style="justify-content:flex-start;gap:10px;">
          <span>🚪</span> Log Out
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-content">
      <!-- Topbar -->
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="mobile-menu-btn" id="menuToggle" aria-label="Toggle sidebar">☰</button>
          <div>
            <div class="topbar-title">My Tasks</div>
            <div style="font-size:12px;color:var(--text-muted);" id="topbarDate"></div>
          </div>
        </div>
        <div class="topbar-right">
          <div style="font-size:13px;color:var(--text-secondary);" id="topbarGreeting"></div>
          <div class="user-avatar" id="topbarAvatar" style="width:36px;height:36px;font-size:14px;">?</div>
        </div>
      </header>

      <!-- Content -->
      <main class="content-area">
        <!-- Welcome banner -->
        <div class="card" id="welcomeBanner" style="padding:24px 28px;margin-bottom:28px;background:linear-gradient(135deg,var(--primary) 0%,#9333ea 100%);border:none;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
          <div>
            <h2 style="color:#fff;margin-bottom:4px;" id="welcomeMsg">Welcome back! 👋</h2>
            <p style="color:rgba(255,255,255,.8);margin:0;font-size:14px;">Here's what's happening with your tasks today.</p>
          </div>
          <div style="font-size:48px;">🚀</div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card card">
            <div class="stat-icon purple">📋</div>
            <div>
              <div class="stat-value" id="statTotal">0</div>
              <div class="stat-label">Total Tasks</div>
            </div>
          </div>
          <div class="stat-card card">
            <div class="stat-icon green">✅</div>
            <div>
              <div class="stat-value" id="statDone">0</div>
              <div class="stat-label">Completed</div>
            </div>
          </div>
          <div class="stat-card card">
            <div class="stat-icon orange">⏳</div>
            <div>
              <div class="stat-value" id="statPending">0</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>
        </div>

        <!-- Create task form -->
        <div class="card task-panel">
          <div class="panel-header">
            <span style="font-size:18px;">➕</span>
            <h3 style="margin:0;">Add New Task</h3>
          </div>
          <div class="panel-body">
            <form id="createForm" novalidate>
              <div class="task-form-grid">
                <div class="form-group span2">
                  <label class="form-label" for="newTitle">Title <span style="color:var(--danger)">*</span></label>
                  <input type="text" id="newTitle" class="form-input" placeholder="What needs to be done?" required />
                  <span class="form-error" id="newTitleError"></span>
                </div>
                <div class="form-group span2">
                  <label class="form-label" for="newDesc">Description</label>
                  <textarea id="newDesc" class="form-textarea" placeholder="Optional details…"></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label" for="newPriority">Priority</label>
                  <select id="newPriority" class="form-select">
                    <option value="low">🟢 Low</option>
                    <option value="medium" selected>🟡 Medium</option>
                    <option value="high">🔴 High</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="newDue">Due date</label>
                  <input type="date" id="newDue" class="form-input" />
                </div>
                <div class="span2" style="display:flex;justify-content:flex-end;">
                  <button type="submit" class="btn btn-primary" id="createBtn">
                    <span id="createBtnText">➕ Add Task</span>
                    <span id="createSpinner" class="spinner" style="display:none;"></span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Controls: search + filter + priority filter -->
        <div class="controls-bar">
          <div class="search-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="search" id="searchInput" class="form-input" placeholder="Search tasks…" aria-label="Search tasks" />
          </div>
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="pending">Pending</button>
            <button class="filter-tab" data-filter="completed">Completed</button>
          </div>
          <select id="priorityFilter" class="form-select" style="width:auto;min-width:130px;">
            <option value="">All Priorities</option>
            <option value="high">🔴 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>

        <!-- Task list -->
        <div id="taskList" class="task-list" role="list" aria-label="Task list">
          <!-- Tasks rendered by JS -->
        </div>

        <!-- Loading skeleton (shown while fetching) -->
        <div id="loadingSkeleton" style="display:flex;flex-direction:column;gap:12px;">
          <div style="height:88px;border-radius:var(--radius-lg);" class="skeleton"></div>
          <div style="height:88px;border-radius:var(--radius-lg);" class="skeleton"></div>
          <div style="height:88px;border-radius:var(--radius-lg);" class="skeleton"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
