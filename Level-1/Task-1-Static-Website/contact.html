
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelCraft | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="logo" href="index.html">PixelCraft.</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page">
    <p class="tag">CONTACT US</p>
    <h1>Let's talk about your ideas.</h1>
    <p>Have a question about our demo services? Contact us below.</p>

    <form>
      <label for="name">Your name</label>
      <input id="name" type="text" placeholder="Enter your name" required>

      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" rows="5"
        placeholder="Write your message" required></textarea>

      <button class="btn" type="submit">Send Message</button>
    </form>
    <p class="note">Demo form only — messages are not sent to a server.</p>
  </main>

  <footer>© 2026 PixelCraft Studio. Demo project.</footer>
</body>
</html>
